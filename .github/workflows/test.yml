name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: luced-2d
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luced-2d luce
      - name: Linux libraries the window and font backends link, a software Vulkan driver (lavapipe) for the headless canvas, and a virtual X display for the clipboard tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core mesa-vulkan-drivers xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build the compilers from main
        working-directory: luced-2d
        run: python3 tools/bootstrap.py
      - name: Headless tests of the workspace, view and panels
        working-directory: luced-2d
        env:
          LUC_HOME: ${{ runner.temp }}/luc-home
          LUCE_STD: ${{ github.workspace }}/luce-base/src/std
        # Linux has no display on the runner: the clipboard tests get a virtual one.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python3 tests/run.py --base build/toolchain/luce-base --luce build/toolchain/luce
          else
            python3 tests/run.py --base build/toolchain/luce-base --luce build/toolchain/luce
          fi
